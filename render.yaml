services:
  - type: worker
    name: position-monitor-worker
    runtime: docker
    plan: starter
    autoDeploy: true
    dockerCommand: python -m src.workers.monitor_worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: options-agent-db
          property: connectionString
      - key: EXECUTION_MODE
        value: PAPER
      - key: ACTIVE_EXECUTION_BROKER
        value: alpaca
      - key: ALPACA_TRADING_ENABLED
        value: "true"
      - key: ROBINHOOD_TRADING_ENABLED
        value: "false"
      - key: PAPER_EXECUTION_BROKER
        value: alpaca
      - key: ALPACA_PAPER_ACCOUNT_NUMBER
        value: "PA35XZXE8ZZE"
      - key: ALPACA_BASE_URL
        value: "https://paper-api.alpaca.markets"
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ROBINHOOD_ACCOUNT_NUMBER
        value: "512500422"
      - key: ROBINHOOD_ACCOUNT_NICKNAME
        value: "MCP"
      - key: UNUSUAL_WHALES_API_KEY
        sync: false
      - key: WEBHOOK_NOTIFICATION_URL
        sync: false

  - type: cron
    name: screener-cron
    runtime: docker
    plan: starter
    schedule: "45 13,16 * * 1-5"
    dockerCommand: python -m src.workers.screener_job
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: options-agent-db
          property: connectionString
      - key: EXECUTION_MODE
        value: PAPER
      - key: ACTIVE_EXECUTION_BROKER
        value: alpaca
      - key: ALPACA_TRADING_ENABLED
        value: "true"
      - key: ROBINHOOD_TRADING_ENABLED
        value: "false"
      - key: PAPER_EXECUTION_BROKER
        value: alpaca
      - key: ALPACA_PAPER_ACCOUNT_NUMBER
        value: "PA35XZXE8ZZE"
      - key: ALPACA_BASE_URL
        value: "https://paper-api.alpaca.markets"
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ROBINHOOD_ACCOUNT_NUMBER
        value: "512500422"
      - key: ROBINHOOD_ACCOUNT_NICKNAME
        value: "MCP"
      - key: UNUSUAL_WHALES_API_KEY
        sync: false
      - key: WEBHOOK_NOTIFICATION_URL
        sync: false

  - type: cron
    name: friday-ml-backtest-cron
    runtime: docker
    plan: starter
    schedule: "30 20 * * 5"
    dockerCommand: python -m src.workers.ml_retrain_job
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: options-agent-db
          property: connectionString
      - key: EXECUTION_MODE
        value: PAPER
      - key: ACTIVE_EXECUTION_BROKER
        value: alpaca
      - key: ALPACA_TRADING_ENABLED
        value: "true"
      - key: ROBINHOOD_TRADING_ENABLED
        value: "false"
      - key: PAPER_EXECUTION_BROKER
        value: alpaca
      - key: ALPACA_PAPER_ACCOUNT_NUMBER
        value: "PA35XZXE8ZZE"
      - key: ALPACA_BASE_URL
        value: "https://paper-api.alpaca.markets"
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ROBINHOOD_ACCOUNT_NUMBER
        value: "512500422"
      - key: ROBINHOOD_ACCOUNT_NICKNAME
        value: "MCP"
      - key: WEBHOOK_NOTIFICATION_URL
        sync: false

databases:
  - name: options-agent-db
    databaseName: options_agent
    user: options_agent_user
    plan: basic-256mb
